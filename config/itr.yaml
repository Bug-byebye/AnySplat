# Pretrained model path (local first, fallback to HuggingFace Hub if not found)
pretrained_model_path: "pretrained_model"

input_folder: "exp-results/ss-exp/vrnerf_20260205_062447/kitchen/input_images"
output_folder: "exp-results/itr-exp" # Output root, final dir will be itr_<timestamp>

iters: 5
image_sorted: true
group_size: 8
interp_frames: 2
seed: 123

# Modules to finetune (matched by parameter name substring)
train_components:
  - "encoder.gaussian_adapter"
  - "encoder.gaussian_param_head"
  # - "encoder.camera_head"

# Device: "auto" | "cuda" | "cpu"
device: "cuda"

export_ply: true
lr: 0.0002
# loss_type: "l1_mse" | "lpips" | "l1_mse_lpips"
loss_type: "l1_mse_lpips"

l1_weight: 1.0
mse_weight: 1.0
lpips_weight: 0.05

# Loss weights
context_gt_weight: 1.0
context_consistency_weight: 0.1
target_consistency_weight: 0.05
