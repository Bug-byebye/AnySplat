experiment:
  dataset: "dl3dv-evaluation" # vr-nerf | matrixcity | dl3dv-evaluation
  methods: ["feed_forward", "diffi_enhance"] # supported: feed_forward | ttt | itr | diffi_enhance
  pretrained_model_path: "pretrained_model"
  pool_size: 20
  pool_stride: 3
  num_context: 10
  num_test: 8
  test_sampling_mode: "pose_extreme" # "uniform" | "pose_extreme"
  # pose_extreme: run AnySplat on all pool views, sort by pose, take half test views from both ends,
  # and sample the remaining half uniformly at random from the rest.
  num_train: 10
  train_distribution: "uniform" # "uniform" | "ordered"
  output_metrics_dir: "compare-results/metrics-record"
  output_image_root_dir: "compare-results"
  seed: 123

vr-nerf:
  dataset_root: "/data/sunchang/datasets-raw/vrnerf"
  scenes: "/data/sunchang/datasets-raw/vrnerf/scenes_used.json"
  camera_id: "18"
  fisheye_camera_id: "4"
  images_subdir: "images-jpeg-1k"

matrixcity:
  dataset_root: "/data/sunchang/datasets-raw/matrixcity/bdaibdai___MatrixCity"
  scope: "big"  # big | small | fusion
  species: "street"  # all | street | aerial
  images_subdir: "images"


dl3dv-evaluation:
  dataset_root: "/data/sunchang/datasets-raw/dl3dv/DL3DV-Evaluation"
  index: "images_4" # for resolution, choice: images | images_2 | images_4 | images_8
  images_subdir: null # Will automatically look in dataset_root/images/
  max_scenes: null

